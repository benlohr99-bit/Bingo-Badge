<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Bingo Achievement</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #f7f1e8, #fffaf4);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      overflow: hidden;
    }

    .card {
      width: 100%;
      max-width: 420px;
      background: white;
      border-radius: 24px;
      padding: 30px 24px;
      text-align: center;
      box-shadow: 0 12px 35px rgba(0,0,0,0.12);
      position: relative;
      z-index: 2;
    }

    .badge {
      width: 110px;
      height: 110px;
      margin: 0 auto 22px;
      border-radius: 50%;
      background: linear-gradient(135deg, #d4af37, #f3dd7a);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 48px;
      box-shadow:
        inset 0 4px 10px rgba(255,255,255,0.45),
        0 8px 22px rgba(212,175,55,0.35);
    }

    h1 {
      margin: 0;
      font-size: 30px;
      color: #222;
      line-height: 1.2;
    }

    .wedding {
      margin-top: 18px;
      font-size: 18px;
      color: #444;
      font-weight: bold;
    }

    .date {
      margin-top: 6px;
      font-size: 15px;
      color: #777;
    }

    .description {
      margin-top: 22px;
      font-size: 16px;
      line-height: 1.6;
      color: #555;
    }

    .achievement {
      margin-top: 28px;
      background: #faf6ef;
      border: 2px dashed #d4af37;
      border-radius: 18px;
      padding: 20px;
    }

    .achievement-title {
      font-size: 26px;
      font-weight: bold;
      color: #8b6b12;
      margin-bottom: 12px;
    }

    .achievement-text {
      color: #555;
      line-height: 1.5;
      font-size: 15px;
    }

    .confetti {
      position: fixed;
      top: -10px;
      width: 10px;
      height: 10px;
      opacity: 0.85;
      animation: fall linear forwards;
    }

    @keyframes fall {
      to {
        transform: translateY(110vh) rotate(720deg);
      }
    }
  </style>
</head>

<body>

  <div class="card">

    <div class="badge">🔢</div>

    <h1>Du hast das<br>BINGO geschafft!</h1>

    <div class="wedding">
      Hochzeit Samuel und Chiara
    </div>

    <div class="date">
      23.05.2026
    </div>

    <div class="description">
      Davon hast du zwar nichts außer diesen lausigen Titel,
      aber vielleicht hast du ja Spaß gehabt und jemanden
      kennen gelernt.
    </div>

    <div class="achievement">

      <div class="achievement-title">
        Bingo-Meister
      </div>

      <div class="achievement-text">
        Ich hab das Bingo gelöst und ich hab nichts gekriegt
        außer dieses blöde Abzeichen!
      </div>

    </div>

  </div>

  <script>
    const colors = [
      "#d4af37",
      "#ff7aa2",
      "#7ad7ff",
      "#8cff8c",
      "#ffd966"
    ];

    for (let i = 0; i < 80; i++) {
      const confetti = document.createElement("div");
      confetti.classList.add("confetti");

      confetti.style.left = Math.random() * 100 + "vw";
      confetti.style.background =
        colors[Math.floor(Math.random() * colors.length)];

      const size = 6 + Math.random() * 10;

      confetti.style.width = size + "px";
      confetti.style.height = size + "px";

      confetti.style.animationDuration =
        3 + Math.random() * 4 + "s";

      document.body.appendChild(confetti);
    }
  </script>

</body>
</html>
