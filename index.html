<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Bingo Achievement</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #f7f1e8, #fffaf4);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      overflow: hidden;
    }

    #confetti-layer {
      position: fixed;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      z-index: 0;
    }

    .card {
      width: 100%;
      max-width: 420px;
      background: white;
      border-radius: 24px;
      padding: 30px 24px;
      text-align: center;
      box-shadow: 0 12px 35px rgba(0,0,0,0.12);
      position: relative;
      z-index: 2;
    }

    /* ===== BADGE (OPTIMIERT) ===== */
    .badge {
      width: 130px;
      height: 130px;
      margin: 0 auto 22px;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, #f7e7a1, #d4af37);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow:
        inset 0 6px 14px rgba(255,255,255,0.5),
        0 10px 25px rgba(212,175,55,0.4);
      overflow: hidden;
      position: relative;
    }

    .badge img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scale(1.05);
    }

    h1 {
      margin: 0;
      font-size: 30px;
      color: #222;
      line-height: 1.2;
    }

    .wedding {
      margin-top: 18px;
      font-size: 18px;
      color: #444;
      font-weight: bold;
    }

    .date {
      margin-top: 6px;
      font-size: 15px;
      color: #777;
    }

    .description {
      margin-top: 22px;
      font-size: 16px;
      line-height: 1.6;
      color: #555;
    }

    .achievement {
      margin-top: 34px;
      padding: 26px 20px 22px;
      border-radius: 18px;
      background: linear-gradient(145deg, #fffaf0, #f7ecd2);
      border: 3px solid #d4af37;
      position: relative;
      box-shadow:
        0 10px 25px rgba(0,0,0,0.12),
        inset 0 2px 6px rgba(255,255,255,0.6);
    }

    .achievement::before {
      content: "";
      position: absolute;
      top: -18px;
      left: 50%;
      transform: translateX(-50%);
      width: 90px;
      height: 28px;
      background: linear-gradient(135deg, #c0392b, #e74c3c);
      border-radius: 6px;
      box-shadow: 0 6px 12px rgba(0,0,0,0.15);
    }

    .achievement::after {
      content: "";
      position: absolute;
      top: -6px;
      left: 50%;
      transform: translateX(-50%);
      width: 14px;
      height: 14px;
      background: #d4af37;
      border-radius: 50%;
      box-shadow: inset 0 2px 3px rgba(255,255,255,0.5);
    }

    .achievement-title {
      font-size: 26px;
      font-weight: bold;
      color: #8b6b12;
      margin-top: 8px;
      margin-bottom: 12px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .achievement-text {
      color: #555;
      line-height: 1.5;
      font-size: 15px;
    }

    .confetti {
      position: absolute;
      top: -10px;
      width: 10px;
      height: 10px;
      opacity: 0.85;
      animation: fall linear forwards;
    }

    @keyframes fall {
      to {
        transform: translateY(110vh) rotate(720deg);
      }
    }
  </style>
</head>

<body>

  <div id="confetti-layer"></div>

  <div class="card">

    <div class="badge">
      <img src="bingo.png" alt="Bingo Symbol">
    </div>

    <h1>Du hast das<br>BINGO geschafft!</h1>

    <div class="wedding">
      Hochzeit Samuel und Chiara
    </div>

    <div class="date">
      23.05.2026
    </div>

    <div class="description">
      Davon hast du zwar nichts außer diesen lausigen Titel,
      aber vielleicht hast du ja Spaß gehabt und jemanden
      kennen gelernt.
    </div>

    <div class="achievement">

      <div class="achievement-title">
        Bingo-Meister
      </div>

      <div class="achievement-text">
        Ich hab das Bingo gelöst und ich hab nichts gekriegt
        außer dieses blöde Abzeichen!
      </div>

    </div>

  </div>

  <script>
    const colors = [
      "#d4af37",
      "#ff7aa2",
      "#7ad7ff",
      "#8cff8c",
      "#ffd966"
    ];

    const layer = document.getElementById("confetti-layer");

    function spawnConfetti() {
      const c = document.createElement("div");
      c.classList.add("confetti");

      c.style.left = Math.random() * 100 + "vw";
      c.style.top = "-10px";
      c.style.background = colors[Math.floor(Math.random() * colors.length)];

      const size = 6 + Math.random() * 10;
      c.style.width = size + "px";
      c.style.height = size + "px";

      c.style.animationDuration = (3 + Math.random() * 3) + "s";

      layer.appendChild(c);

      setTimeout(() => {
        c.remove();
      }, 8000);
    }

    setInterval(() => {
      const burst = 2 + Math.floor(Math.random() * 3);
      for (let i = 0; i < burst; i++) {
        spawnConfetti();
      }
    }, 120);
  </script>

</body>
</html>
